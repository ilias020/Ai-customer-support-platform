name: Backend CI

on:
  pull_request:
    branches:
      - development
      - main
  push:
    branches:
      - development
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ai_customer_support_test
          POSTGRES_USER: nimbus
          POSTGRES_PASSWORD: nimbus_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nimbus -d ai_customer_support_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: testing
      DATABASE_URL: postgresql+psycopg://nimbus:nimbus_ci_password@localhost:5432/ai_customer_support_test
      TEST_DATABASE_URL: postgresql+psycopg://nimbus:nimbus_ci_password@localhost:5432/ai_customer_support_test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Ruff linting
        run: python -m ruff check .

      - name: Check Ruff formatting
        run: python -m ruff format --check .

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Run backend tests
        run: python -m pytest